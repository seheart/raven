# Raven CI — runs the verification suite on every PR and every push to main.
#
# Node version: 20. README says "Node 18+"; 20 is the current LTS and is
# what the dev contributors run locally. Bumping to 22/24 later is a
# one-line change.
#
# Notes & deliberate omissions:
#   - svelte-check is informational, not gating. Baseline is ~2041 errors
#     today (a known debt — see frontend/CLAUDE.md / type-coverage thresholds).
#     We surface the count in the log; we do NOT fail the build on it.
#   - No coverage threshold gate. This is the FIRST simple CI; we deliberately
#     don't turn the first PR run into a wall of red checks. Add gates later.
#   - The repo already has a heavier "governance" workflow with knip + depcruise +
#     type-coverage. This file is the lean PR gate that runs on every commit.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands — saves
# Actions minutes on rapid push cycles.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (ubuntu-latest)
    # macOS coverage was dropped from the per-PR matrix: macos-14 bills at 10×
    # and was burning ~30% of this repo's Actions budget. Re-add as a weekly
    # cron in a separate workflow if you want to keep proving cross-platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint (eslint)
        working-directory: backend
        run: npm run lint

      - name: Tests (jest)
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          DISABLE_AUTH: 'true'

  frontend:
    name: Frontend (svelte-check + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Informational only — baseline ~2041 errors today. `|| true` keeps the
      # step green; the tail-3 line shows the count so we can watch drift.
      - name: svelte-check (informational, non-gating)
        working-directory: frontend
        run: npx svelte-check --output machine 2>&1 | tail -3 || true

      - name: Tests (vitest)
        working-directory: frontend
        run: npm run test:run

      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (playwright, chromium only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Cache Playwright's browser download dir (separate from npm cache).
      # Keyed by the installed @playwright/test version so a bump invalidates.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build backend (produces backend/dist/)
        working-directory: backend
        run: npm run build

      - name: Run E2E (chromium only)
        run: npx playwright test --project=chromium --reporter=line
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  dep-cruiser:
    name: dep-cruiser (backend architecture rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # The dependency-cruiser config lives in backend/.dependency-cruiser.cjs
      # and only covers the backend tree (paths are relative to backend/).
      # The frontend has no cruiser config, so we don't include it here.
      - name: dependency-cruiser (backend)
        working-directory: backend
        run: npm run lint:arch

  knip:
    name: knip (dead-code scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Matches the `npm run lint:dead` script in the root package.json.
      - name: knip
        run: npm run lint:dead
