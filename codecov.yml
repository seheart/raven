# Codecov Configuration
# Manages coverage reporting and enforcement

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: '60...90'

  status:
    project:
      default:
        target: 60%
        threshold: 2%
        base: auto

    patch:
      default:
        target: 60%
        threshold: 5%

comment:
  layout: 'reach,diff,flags,tree,reach'
  behavior: default
  require_changes: false

flags:
  frontend:
    paths:
      - frontend/src/
    carryforward: true

  backend:
    paths:
      - backend/
    carryforward: true

ignore:
  - '**/*.test.js'
  - '**/*.spec.js'
  - '**/test/**'
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/mocks/**'
  - '**/*.config.js'
  - '**/dist/**'
  - '**/coverage/**'
  - '**/node_modules/**'
