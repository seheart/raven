[package]
name = "raven"
version = "0.6.0"
edition = "2021"
authors = ["Seth Eheart <seth@example.com>"]
description = "Local-first, lightning-fast monitoring tool for AI coding agents"
repository = "https://github.com/seheart/raven"
license = "MIT"
keywords = ["ai", "monitoring", "development", "tauri"]
categories = ["development-tools"]

[[bin]]
name = "raven"
path = "src/bin/raven-cli.rs"

[dependencies]
tauri = { version = "2.1", features = ["devtools"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "7.0"
notify-debouncer-full = "0.3"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
similar = "2.6"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.42", features = ["full"] }
chrono = "0.4"
anyhow = "1.0"
toml = "0.8"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
tar = "0.4"
flate2 = "1.0"

[dev-dependencies]
tempfile = "3.14"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
